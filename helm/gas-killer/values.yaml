# Default values for gas-killer Helm chart

# Image pull secrets for private registries (e.g. ghcr.io/gas-killer/service).
# Create the secret first:
#   kubectl create secret docker-registry ghcr-pull-secret \
#     --docker-server=ghcr.io \
#     --docker-username=<github-username> \
#     --docker-password=<github-pat>
# Then reference it here:
#   --set 'imagePullSecrets[0].name=ghcr-pull-secret'
imagePullSecrets: []

# Global settings
global:
  # Environment mode: LOCAL or TESTNET
  # LOCAL: Uses Anvil with forked L1, auto-deploys AVS contracts to local fork
  #        Requires: secrets.forkUrl (L1 RPC to fork from)
  # TESTNET: Connects directly to real L1 network
  #          Requires: secrets.httpRpc (L1 RPC endpoint)
  #          AVS contracts are deployed to real L1
  environment: LOCAL

  # Quorum signature scheme: "bls" (default) or "schnorr". Every binary in the deployment must
  # agree, so the chart renders one value into both the router and the nodes. An unrecognized
  # value fails the template rather than reaching the pods, which panic on it.
  #
  # "schnorr" replaces the aggregation engine's BLS certificates with a two-round MuSig2
  # coordinator on p2p channel 2, producing one constant-gas signature verified against a
  # SchnorrStakeRegistry. It changes three things:
  #   - each node also loads a secp256k1 signing key, separate from its BN254 p2p identity;
  #   - the schnorr-operators job deploys the registry and registers the operator set on install,
  #     before any target deploys (see the `schnorr` block below);
  #   - targets must be SchnorrGasKillerSDK consumers wired to that registry.
  #
  # Switching an existing deployment strands every BLS target already deployed against it, so it
  # is a reinstall of the operator set and a redeploy of every target, not a rolling change.
  signatureScheme: "bls"

  # Storage-update encoding: "legacy" (default), "canonical", or "prestate-net".
  # Selects the signed representation of a task's storage mutations, so like
  # signatureScheme every binary in the deployment must agree — it changes the task
  # digest, and a rolling update that transiently mixes encodings fails quorum until
  # it converges. Prefer recreating nodes and router together when changing it.
  #
  # "prestate-net" reads the target's net diff from prestateTracer/callTracer instead
  # of a struct-log trace, which is what makes heavy-compute tracked functions
  # extractable; it REQUIRES every node's and the router's RPC to support
  # debug_traceCall with prestateTracer (diffMode) and callTracer (withLog), and fails
  # the task rather than downgrading if they are missing. Hosted providers often gate
  # prestateTracer to paid tiers — confirm before enabling.
  #
  # Support alone is not enough on a mixed fleet: the clients must also agree on
  # tracer OUTPUT. callTracer log ordering depends on whether the client populates the
  # global `index` (geth populates `position` instead), so two operators on different
  # clients can order logs differently and fork the digest while both "supporting" the
  # tracers. Until gas-analyzer#178 settles on one source, only enable this on a
  # single-client fleet. See the STATE_ENCODING block in example.env.
  stateEncoding: "legacy"

  # Tracked-function simulation profile: "chain" (default) or "unbounded". Selects the
  # gas limits the tracked function is SIMULATED under, where stateEncoding selects how the
  # resulting mutations are represented — independent axes, but this one is equally a
  # consensus parameter: it changes the derived storage_updates and hence the task digest,
  # so every node and the router must agree. An unrecognized value panics the binary at
  # startup rather than defaulting, so a typo crash-loops instead of forking the quorum.
  #
  # "unbounded" simulates under the pinned unbounded gas limits, letting the fleet settle
  # tracked functions whose direct execution costs more than a block's gas limit. It
  # REQUIRES the RPC serving debug_traceCall to have its execution cap lifted, and pairs
  # with stateEncoding: "prestate-net" (a struct-log trace of an above-block-limit call is
  # what it avoids). See the GK_SIM_PROFILE block in example.env and gas-analyzer
  # docs/UNBOUNDED_MODE.md.
  #
  # DO NOT set this to unbounded on a production fleet yet. Three preconditions are still
  # open, tracked in gas-killer/service#356:
  #   1. The SP1 fraud-proof guest must bind the same lifted limits (sp1-contract-call#12).
  #      A guest checking against real header limits while operators simulate under lifted
  #      ones would judge an honest operator's payload invalid — i.e. false slashing.
  #   2. The payload gate's per-byte dispatch constant needs re-measuring against a real
  #      verifyAndUpdate rather than the analyzer's estimator handler (gas-analyzer#166).
  #   3. Every operator's debug_traceCall RPC needs its own execution cap lifted.
  # And because the profile changes the task digest, flipping it is a coordinated fleet-wide
  # change rather than a rolling one: a partially migrated fleet fails quorum until it converges.
  simProfile: "chain"

  # Acknowledges that the ethereum image's entrypoint starts Anvil with
  # --disable-block-gas-limit, which simProfile: "unbounded" needs in LOCAL mode to execute an
  # above-block-limit call at all. The chart cannot supply that flag — it lives in the image — so
  # rendering fails on the LOCAL + unbounded combination until this is set. That turns a
  # runtime failure of every heavy task into an install-time error. Irrelevant for TESTNET, where
  # the RPC is external and its cap is the operator's responsibility.
  localAnvilUnboundedReady: false

  # Number of operator nodes to deploy
  nodeCount: 3

  # Timeout for init containers waiting for dependencies (in seconds)
  initTimeout: 300

# GCP Secret Manager configuration for TESTNET deployments
# When enabled, operator BLS keys and avs_deploy.json are read from GCP Secret Manager
# rather than the shared PVC. This makes keys durable across cluster recreations.
#
# Setup:
#   1. Provision the GKE cluster and GCP service account(s) via Terraform in the
#      gas-killer/infra repo (terraform/dev or terraform/prod)
#   2. Copy the service account email output into secretManager.gcpServiceAccount below
#      (dev: gcp_service_account_email; prod: app_service_account_email)
#   3. Set secretManager.projectId to your GCP project ID
#
# Secret naming in GCP Secret Manager:
#   {keyPrefix}-node-{N}-bls-key   (one per operator node)
#   {keyPrefix}-avs-deploy          (avs_deploy.json from the setup job)
#
# These secrets are created automatically by the key-export job on first helm install.
secretManager:
  enabled: false
  projectId: ""
  keyPrefix: "gas-killer"
  # GCP Service Account email for Workload Identity. Copy from the gas-killer/infra
  # terraform output (dev: gcp_service_account_email; prod: app_service_account_email):
  #   terraform output -raw app_service_account_email
  gcpServiceAccount: ""
  # Kubernetes ServiceAccount name. Defaults to <release>-sa (e.g. "gas-killer-sa").
  # Must match the gas-killer/infra terraform var kubernetes_service_account_name.
  # Override if your release name differs from what Terraform expects:
  #   --set secretManager.serviceAccountName=my-release-sa
  serviceAccountName: ""
  # Pinned Google Cloud SDK image used by key-export, fetch-secrets, and fetch-avs-deploy containers.
  # Override to use a newer version: --set secretManager.cloudSdkImage=google/cloud-sdk:500.0.0-slim
  cloudSdkImage: "google/cloud-sdk:496.0.0-slim"

# Manual retry flags for one-time hook jobs.
# On helm install these jobs run automatically. On helm upgrade they are suppressed
# unless you explicitly opt in — preventing unrelated upgrades from re-triggering
# long-running operations.
#
# Usage:
#   helm upgrade gas-killer ./helm/gas-killer --set rerun.bridge=true
rerun:
  setup: false
  bridge: false
  keyExport: false
  # Re-run the deploy-target job to deploy a fresh demo target + checker against the current AVS.
  deployTarget: false
  # Re-run the playground job. Only set this deliberately: it deploys a fresh public target and
  # factory, which strands the addresses /avs-metadata is currently serving and resets a counter a
  # reader may be part-way through advancing. The job is otherwise install-only, and skips any
  # contract it already recorded that still has code on chain.
  playground: false
  # Re-run the schnorr operator-set job (global.signatureScheme=schnorr only). Only set this
  # deliberately: without schnorr.stakeRegistryAddress the job deploys a FRESH
  # SchnorrStakeRegistry and re-registers every operator, which orphans every target already
  # wired to the old one. The job is otherwise install-only, and skips when avs_deploy.json
  # already records a registry address.
  schnorrOperators: false
  # Re-run the generate-router-key job (TESTNET+secretManager only).
  # Only set this if you intentionally want to rotate the router BLS keypair —
  # doing so requires all nodes to restart and pick up the new public key from GCP.
  # Also triggers key-export so the new public key is uploaded to Secret Manager.
  generateRouterKey: false

# Secrets configuration
# All sensitive values should be provided via --set or existingSecret
secrets:
  # Use an existing Kubernetes secret instead of creating one
  # Required keys: PRIVATE_KEY, FUNDED_KEY, FORK_URL
  existingSecret: ""

  # Private keys for signing transactions
  # Override with: --set secrets.privateKey=<your-key>
  privateKey: ""
  fundedKey: ""

  # Fork URL for Anvil (contains API key - sensitive!)
  # REQUIRED for LOCAL mode - Anvil will fork from this RPC URL
  # Override with: --set secrets.forkUrl=<your-rpc-url>
  # Example: --set secrets.forkUrl=https://eth-sepolia.g.alchemy.com/v2/YOUR_KEY
  forkUrl: ""

  # Direct RPC URL for L1 (contains API key - sensitive!)
  # REQUIRED for TESTNET mode - nodes/router connect directly to this RPC
  # Override with: --set secrets.httpRpc=<your-rpc-url>
  # Example: --set secrets.httpRpc=https://eth-sepolia.g.alchemy.com/v2/YOUR_KEY
  httpRpc: ""

  # L2 Fork URL for local L2 Anvil (only used in LOCAL mode with l2.enabled=true)
  # Override with: --set secrets.l2ForkUrl=<your-l2-rpc-url>
  # Example: --set secrets.l2ForkUrl=https://rpc.gnosischain.com
  l2ForkUrl: ""

  # Direct RPC URL for L2 in TESTNET mode (contains API key - sensitive!)
  # Override with: --set secrets.l2HttpRpc=<your-l2-rpc-url>
  # Example: --set secrets.l2HttpRpc=https://rpc.gnosischain.com
  l2HttpRpc: ""

  # Shared secret guarding the /admin/keys endpoints, used to mint and revoke per-client API
  # keys via Authorization: Bearer <adminKey>. Clients then authenticate POST /tasks with their
  # minted key. Required for TESTNET deployments with ingress enabled.
  # Override with: --set secrets.adminKey=<your-admin-key>
  adminKey: ""

# L1 (Anvil) configuration - only used in LOCAL mode
l1:
  enabled: true
  image:
    repository: ghcr.io/breadchaincoop/ethereum
    tag: latest
    pullPolicy: IfNotPresent
  # Priority class for L1 pod - it holds critical blockchain state
  # Consider creating a custom priority class instead of using system-cluster-critical
  # See README.md for details
  priorityClassName: "system-cluster-critical"
  service:
    type: ClusterIP
    port: 8545
  resources:
    requests:
      memory: "1Gi"
      cpu: "500m"
    limits:
      memory: "2Gi"
      cpu: "1000m"

# EigenLayer setup job configuration
eigenlayer:
  image:
    repository: ghcr.io/breadchaincoop/eigenlayer
    tag: latest
    pullPolicy: IfNotPresent
  # L1 contract addresses — required in all modes. In LOCAL mode these must match the
  # network being forked (forkUrl); in TESTNET mode they must match the live network.
  # No defaults: set these explicitly via an overrides file (e.g. testnet-overrides.yaml).
  contracts:
    delegationManager: ""
    strategyManager: ""
    lstContract: ""
    lstStrategy: ""
    allocationManager: ""
  quorum:
    # Minimum LST stake (in wei) required to register as an operator.
    # Combined with the 1 ether strategy multiplier in SetupMiddleware.s.sol, this is
    # effectively the minimum token amount. "1" = no real minimum (local/testnet only).
    minimumStake: "1"
    # Maximum number of operators in the quorum.
    maxOperatorCount: 4
    # BIPs of an operator's own stake that must be exceeded to kick them (10000 = 100%).
    kickBIPsOfOperatorStake: 10000
    # BIPs of total quorum stake below which an operator can be kicked (100 = 1%).
    kickBIPsOfTotalStake: 100
  # Immutable constructor parameters for AvsServiceManagerWrapper — baked into the
  # contract at deploy time. Cannot be changed without redeploying (rerun.setup=true).
  sdk:
    # Fraction of stake-weighted operators that must co-sign a task: threshold/denominator.
    # Default 2/3 = two-thirds supermajority.
    quorumThreshold: "2"
    thresholdDenominator: "3"
    # Maximum age (in blocks) of a valid reference block. At ~12s/block, 300 ≈ 1 hour.
    blockStaleMeasure: "300"
  resources:
    requests:
      memory: "1Gi"
      cpu: "500m"
    limits:
      memory: "2Gi"
      cpu: "1000m"

# Signer (Cerberus) configuration
signer:
  enabled: true
  image:
    repository: ghcr.io/layr-labs/cerberus
    tag: "0.0.2"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    grpcPort: 50051
    metricsPort: 9081
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "200m"

# Gas Killer Node configuration
node:
  image:
    # Production image built and pushed by the Docker CI/CD workflow on merge to main / release.
    # For local development, override with:
    #   --set node.image.repository=service --set node.image.tag=node-local --set node.image.pullPolicy=Never
    repository: ghcr.io/gas-killer/service
    tag: ""
    pullPolicy: IfNotPresent
  # Base port for nodes (node-1 uses basePort, node-2 uses basePort+1, etc.)
  basePort: 3001
  # Per-node socket address overrides for operators that run outside this cluster.
  #
  # By default, each node's on-chain socket address is the K8s-internal ClusterIP service
  # name (e.g. "gas-killer-node-1:3001"). Operators inside the same cluster can reach this
  # address, but operators on external networks cannot.
  #
  # Use this map to supply a publicly-reachable "host:port" for any node that needs to be
  # reachable from outside the cluster. Keys are 1-based node indices (as strings).
  # Any node whose index is not listed will continue to use the generated K8s service name.
  #
  # Networking requirements for external operators:
  #   - Each participating operator needs a static public IP or a stable DNS name.
  #   - The port must be reachable from all other operators and the router.
  #   - NAT/firewall rules must allow inbound TCP on the declared port.
  #   - There is currently no relay or NAT-traversal strategy; direct reachability is required.
  #
  # Example — node 1 runs externally, nodes 2-3 stay in-cluster:
  #   socketAddressOverrides:
  #     "1": "203.0.113.42:3001"
  socketAddressOverrides: {}
  # P2P channel message queue depth. Messages are dropped when the queue is full.
  # Increase for bursty workloads; the cost is memory proportional to message size.
  p2pMessageBacklog: 256
  # P2P channel rate limit in messages per second. Accepts floats (e.g. 0.5 = one
  # message every two seconds). Raising beyond gas-analyzer throughput causes queue buildup.
  p2pMessagesPerSecond: "1.0"
  # Writable directory for the aggregation engine's journal (STORAGE_DIR), backed
  # by an emptyDir volume: it survives container restarts within a pod but is
  # cleared when the pod is deleted/rescheduled — deleting the node pods is the
  # documented recovery for a height wedged by split real/skip digests.
  storageDir: /app/data
  # Port for the node's /healthz HTTP endpoint (used by Kubernetes probes)
  healthzPort: 8081
  # How long Kubernetes waits for a node to finish in-flight work after SIGTERM.
  # Must be >= the time needed to complete a validation + sign cycle. Production
  # transactions can take several minutes of EVMSketch compute (see the
  # roundTimeout comment), so 360s covers a full round plus buffer.
  terminationGracePeriodSeconds: 360
  # Stagger EigenSDK eth_getLogs backfill sweeps across nodes so at most one runs at a time.
  # node-1 starts immediately; node-N waits (N-1) * startupDelaySecsPerNode before launching.
  # The router waits nodeCount * startupDelaySecsPerNode. Set to 0 to disable.
  # Remove once the operator-state disk cache (service#275) is implemented.
  startupDelaySecsPerNode: 5
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "2Gi"
      cpu: "500m"

# Gas Killer Router configuration
router:
  image:
    # Production image built and pushed by the Docker CI/CD workflow on merge to main / release.
    # For local development, override with:
    #   --set router.image.repository=service --set router.image.tag=router-local --set router.image.pullPolicy=Never
    repository: ghcr.io/gas-killer/service
    tag: ""
    pullPolicy: IfNotPresent
  port: 3000
  ingressPort: 8080
  # Bind host for the task-ingress HTTP server.
  # 0.0.0.0 (all interfaces) is required in Kubernetes so the pod can receive
  # traffic from the Service. Override to 127.0.0.1 for local-only access.
  ingressBindHost: "0.0.0.0"
  # P2P channel message queue depth. Messages are dropped when the queue is full.
  # Increase for bursty workloads; the cost is memory proportional to message size.
  p2pMessageBacklog: 256
  # P2P channel rate limit in messages per second. Accepts floats (e.g. 0.5 = one
  # message every two seconds). Raising beyond gas-analyzer throughput causes queue buildup.
  p2pMessagesPerSecond: "1.0"
  # Writable directory for the aggregation engine's journal (STORAGE_DIR), backed
  # by an emptyDir volume. The router's journal only caches observed certificates
  # (it is not a signer), so losing it on pod rescheduling is safe: the sequencer
  # re-reads the tip from the network and skips past stale heights.
  storageDir: /app/data
  # Port for the router's /healthz and /readyz HTTP endpoints (used by Kubernetes probes)
  healthzPort: 8081
  # How long Kubernetes waits for a router to finish in-flight work after SIGTERM.
  # Must be >= the time needed to complete an aggregation round, which is bounded by
  # roundTimeout (300s), so 360s lets an in-flight round finish plus buffer.
  terminationGracePeriodSeconds: 360
  # How often (in milliseconds) to poll for a new round between task cycles.
  # Only applies when INGRESS=false (Basic creator). When INGRESS=true the creator
  # blocks on an event-driven channel and this value has no effect.
  pollingIntervalMs: "2000"
  # Max seconds the router waits for operator signatures on a round before abandoning
  # it and moving to the next queued task. The orchestrator submits immediately once
  # the signature threshold is reached, so this is a stalled-round recovery window,
  # not a throttle. Must comfortably exceed worst-case node compute + sign time
  # (production transactions can take several minutes of EVMSketch compute); the cost
  # of a larger value is that a round that never reaches quorum blocks the task queue
  # for the full window. Tune against gas_killer_p2p_round_trip_seconds and the
  # round-timeout panel in the Grafana dashboard.
  roundTimeout: "300"
  # How often (in seconds) the router re-sends the TaskDirective (Announce, then Skip
  # after roundTimeout) for an in-flight height. Under the aggregation engine,
  # rebroadcast-until-certified is a liveness requirement: a node that misses every
  # Announce can only resolve the height as a skip, so this MUST be well below
  # roundTimeout or a single dropped delivery wedges the 3-of-3 quorum.
  rebroadcastInterval: "15"
  # Max seconds the executor waits for a verifyAndUpdate transaction receipt before
  # timing out the round and proceeding to the next one. Prevents an indefinite stall
  # under L1 mempool congestion or RPC degradation. Leave empty to use the per-chain
  # defaults baked into the router (L1: 120s, L2: 30s).
  receiptTimeoutSecs: ""
  # Blocks past the aggregation reference block for which a completed task's rendered,
  # user-signable payload stays valid (its valid_until_block). Must be <= BLOCK_STALE_MEASURE
  # so a payload never outlives the contract's operator-set window.
  payloadBlockBuffer: "50"
  ingress:
    enabled: true
    # IMPORTANT: Must be quoted string to prevent YAML from converting to scientific notation.
    # "0" means no timeout — router waits indefinitely for an incoming task.
    timeoutMs: "0"
    # Maximum tasks the ingress queue holds before shedding load. At capacity, POST /tasks
    # returns 503 QUEUE_FULL with a Retry-After hint. The router processes one task at a time,
    # so this bounds both memory and worst-case queue latency (MAX_QUEUE_DEPTH).
    maxQueueDepth: "100"
    # Default per-API-key request rate on POST /tasks, in requests per minute. Keys issued with a
    # per-key override (via POST /admin/keys) use their own limit instead. Requests over the limit
    # get 429 with a Retry-After header. Counters are in-memory and reset on restart
    # (RATE_LIMIT_RPM).
    rateLimitRpm: "60"
    # Consecutive RPC failures against one chain before that chain is marked unavailable: the
    # gas_killer_rpc_healthy{chain=...} gauge drops to 0, the transition is logged at WARN, and new
    # submissions are refused with 503 RPC_UNAVAILABLE instead of being queued as work that cannot
    # complete. Only an L1 outage sheds traffic — every round anchors to an L1 reference block — so
    # a degraded L2 is alerted without blocking L1 targets. The count is a run, not a total: one
    # success clears it, and a background probe re-checks every chain every 15s so the state
    # recovers on its own. Leave empty to use the router's default of 5 (RPC_FAILURE_THRESHOLD).
    rpcFailureThreshold: ""
    # Deployed target whose avsAddress() and blsSignatureChecker() getters establish the pair
    # published in the `contracts` block of GET /avs-metadata. Leave empty where deployTarget.enabled
    # is true: that job records the target it provisioned at /app/.nodes/demo_target.txt on the
    # shared-data volume and the router is pointed at it (AVS_REFERENCE_TARGET_FILE), so the pair
    # follows every redeployment without anyone editing configuration. Set this only to pin a
    # different target (AVS_REFERENCE_TARGET); resolution retries in the background, so a target
    # recorded after the router starts serving is picked up without a restart.
    avsReferenceTarget: ""
    # Contracts the documentation points readers at, published in the same block. demoTarget is a
    # shared target for a first settlement with no Solidity written; concurrent readers can
    # invalidate each other's payloads on transitionIndex, which demoFactory avoids by giving each
    # reader their own instance. Neither is the deployTarget smoke-test target: public traffic would
    # advance the counter that test depends on, and that address is reminted on every reinstall. Both
    # are omitted from the response when empty, and each is checked for code on the chain the block
    # publishes before it is served, so an address on another network — or one that is simply wrong —
    # is omitted rather than published (DEMO_TARGET_ADDRESS / DEMO_FACTORY_ADDRESS).
    #
    # Leave both empty where playground.enabled is true: that job records what it deployed on the
    # shared-data volume and the router is pointed at those records (DEMO_TARGET_FILE /
    # DEMO_FACTORY_FILE), so the served addresses follow a redeployment. Set these only to point
    # readers at something other than what the job deployed.
    demoTarget: ""
    demoFactory: ""
    # Seconds a task may sit without reaching a terminal state before a background sweep (every
    # 60s) settles it as expired. A queued task past its TTL has a block_height too stale to
    # aggregate into a payload the contract accepts, and a ready payload nobody collected keeps
    # blocking resubmission for its transition index; expiring both frees the capacity for work
    # that can still land. A processing task is never cancelled mid-round. Watch
    # gas_killer_tasks_expired_total — sustained expiries mean the queue is not draining ahead of
    # the staleness window (TASK_TTL_SECONDS). Restart recovery settles separately, under
    # gas_killer_tasks_expired_at_requeue_total.
    # Leave empty to use the router's own default, which is sized to the wall-clock life of a
    # rendered payload on L1 (payloadBlockBuffer blocks x 12s = 600s at the stock buffer) so the
    # sweep never withdraws a payload the chain would still accept. Set a shorter value only for a
    # target chain with faster blocks, where the payload window is proportionally shorter.
    taskTtlSeconds: ""
    # How far behind the target chain's head a submitted block_height may be and still be admitted;
    # past it POST /tasks returns 400 STALE_BLOCK. The analysis is anchored at that block, and both
    # the aggregation round and the rendered payload's validity window have to fit in what is left
    # of the contract's staleness window (eigenlayer.sdk.blockStaleMeasure), so admission holds the
    # payload buffer back rather than accepting work that can only just finish simulating.
    # Leave empty to use the router's derived default, BLOCK_STALE_MEASURE - PAYLOAD_BLOCK_BUFFER
    # (250 at the stock 300/50). A value above the staleness window is clamped to it; "0" disables
    # the check entirely, accepting arbitrarily old anchors (INGRESS_STALENESS_WINDOW_BLOCKS). The
    # effective window is logged at router startup.
    stalenessWindowBlocks: ""
  # AVS identity metadata served at GET /avs-metadata.
  # Set metadata.uri in config.json to the public URL of this endpoint
  # (e.g. https://api.gaskiller.xyz/avs-metadata) before calling updateAVSMetadataURI.
  avsMetadata:
    name: "Gas Killer"
    website: "https://gaskiller.xyz"
    description: "Verifiable off-chain compute service for EVM smart contracts via EigenLayer"
    logo: "https://gaskiller.xyz/brand/gk-wordmark-transparent.png"
    twitter: "https://x.com/gaskiller_"
    # Operator set entry included in the metadata JSON once the quorum is created on-chain.
    # Leave name empty to omit the operatorSets field (e.g. before first setup-job run).
    operatorSet:
      name: "Gas Analysis Quorum"
      id: "0"
      description: "BLS-aggregated operator set for verifiable gas analysis tasks"
      softwareName: "gas-killer-node"
      softwareDescription: "Receives tasks, runs EVM gas analysis, returns a BLS-signed result"
      softwareUrl: "https://github.com/gas-killer/service"
      slashingConditions: "Signing a conflicting result for the same task ID"
  service:
    type: ClusterIP
    port: 3000
    ingressPort: 8080
  # Durable SQLite store for the router (API keys, task state). The store path is exposed
  # to the binary via the DATA_DIR env var. When enabled, a PersistentVolumeClaim keeps the
  # data across pod restarts; when disabled, an emptyDir is used and data is lost on restart
  # (acceptable for ephemeral or dev clusters).
  persistence:
    enabled: true
    mountPath: /data
    storageClass: ""
    size: 1Gi
    accessMode: ReadWriteOnce
    # Applied as the pod's securityContext.fsGroup so the non-root container user can write
    # to the mounted volume. The router image runs as 'appuser' (uid/gid 1000).
    fsGroup: 1000
    # Annotate the PVC with helm.sh/resource-policy: keep, so the store survives
    # `helm uninstall` and is adopted again on the next install.
    #
    # On by default because the API keys here are stored hashed and cannot be re-read: losing
    # the volume silently invalidates every key ever issued, with no way to recover one. That
    # is a worse outcome than the cost of keeping it, and it is not hypothetical — the store
    # was lost exactly once, as collateral damage of an uninstall performed to resize a
    # different PVC in the release.
    #
    # Keeping the claim also makes the PV's reclaim policy moot, since the volume is never
    # released and `Delete` never fires.
    #
    # The costs: the claim outlives the release, so removing it takes an explicit
    # `kubectl delete pvc`, and any future resize of this volume becomes a manual delete for
    # the same reason. Repeated install/uninstall cycles against one long-lived cluster will
    # accumulate a claim; set this to false there, or delete it by label as
    # scripts/run_helm_test.sh does.
    retainOnUninstall: true
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "6Gi"
      cpu: "1000m"

# Orchestrator configuration
orchestrator:
  # Public orchestrator config fields — must be set for LOCAL mode.
  # The "address" field is automatically set to the router service name via the Helm template.
  # Omitted when secretManager.enabled=true (TESTNET): nodes fetch the key from GCP instead.
  publicConfig:
    g2_x1: "20265730220917057623326116620721648047640065506233168445998945605458084341755"
    g2_x2: "1537141129484558011683382469842956131676085503509229854572844956364492197092"
    g2_y1: "4380068110839997539835821427545270098552639074995346826656804866303457881635"
    g2_y2: "479676018937294309080674601592141614301396550682703157902264620243097107417"
    port: "3000"
  # Router BLS private key — two mutually exclusive paths:
  #   1. secretManager.enabled=true (TESTNET): auto-generated by the generate-router-key
  #      job and fetched from GCP Secret Manager at pod start. Do NOT set routerPrivateKey.
  #   2. routerPrivateKey set explicitly: valid for LOCAL mode and for TESTNET deployments
  #      that opt out of Secret Manager (secretManager.enabled=false). Required on TESTNET
  #      if secretManager is disabled — the chart will fail install if neither is set.
  routerPrivateKey: ""

# L2 (Anvil fork) configuration - only used in LOCAL mode
# Defaults to disabled; enable explicitly via --set l2.enabled=true (e.g. in CI)
l2:
  enabled: false
  image:
    repository: ghcr.io/breadchaincoop/ethereum
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8546
  resources:
    requests:
      memory: "1Gi"
      cpu: "500m"
    limits:
      memory: "6Gi"
      cpu: "1000m"

# Bridge configuration - bridges EigenLayer operator state from L1 to L2
bridge:
  enabled: true
  # Wait for bridge job to complete before starting nodes/router
  waitForBridge: true
  image:
    repository: ghcr.io/breadchaincoop/target-contracts/bridge
    tag: latest
    pullPolicy: IfNotPresent
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "500m"

# Deploy-target job: deploys a demo GasKillerSDK target (ArraySummation) wired to a real
# BLSSignatureChecker against the freshly-deployed AVS, then publishes its address to a
# ConfigMap for the local smoke test. Opt-in (off by default; enable on testnet).
# Aggregate-Schnorr settings. Every field here is inert under global.signatureScheme=bls.
# The registry and the operator-set registration come from the schnorr-operators job, which runs
# on install between setup and deploy-target.
schnorr:
  # Secret key (in the app secret) holding the funded key that deploys the registry and submits
  # the registrations: PRIVATE_KEY or FUNDED_KEY. The deployer becomes the registry's owner.
  deployerSecretKey: PRIVATE_KEY

  # Blocks a registry operator-set change must be announced ahead of taking effect. The router
  # ends a rendered payload's validity before the horizon this publishes, so a settlement is
  # never assembled against one operator set and verified against another.
  #
  # 0 applies changes as soon as they are committed, correct here because the whole operator set
  # is registered before any target deploys. A deployment that mutates its set while rounds are
  # in flight must exceed the round duration plus eigenlayer.sdk.blockStaleMeasure.
  noticeWindow: 0

  # Reuse an already-populated SchnorrStakeRegistry instead of deploying a fresh one. Its
  # operator set is assumed complete, so the job submits no registrations. Leave empty to deploy.
  stakeRegistryAddress: ""

  # Per-stage timeout (nonce collection, partial collection) for the coordinator's rounds, in
  # seconds. Empty uses the binary's default of min(5, ROUND_TIMEOUT/6), so several attempts fit
  # inside one round-timeout window.
  stageTimeoutSecs: ""

  # Per-peer message rate for the schnorr protocol channel. Empty uses the binary's default of
  # 64. Size it generously: the p2p sender SILENTLY DROPS messages beyond the rate, and a dropped
  # signing-round message costs a whole retry attempt.
  messagesPerSecond: ""

  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "250m"

deployTarget:
  enabled: false
  image:
    # Built from gas-killer/solidity-sdk (forge + the SDK contracts). Tag must be set at deploy.
    repository: ghcr.io/gas-killer/solidity-sdk
    tag: ""
    pullPolicy: IfNotPresent
  # Image used by the publish step to write the ConfigMap (needs kubectl + a shell).
  # Alpine-based (has /bin/sh for the apply pipe); bitnami/kubectl was retired from Docker Hub.
  kubectlImage: "alpine/kubectl:1.33.4"
  # ConfigMap that receives the deployed target address under key "target".
  configMapName: gas-killer-smoke-target
  # Secret key (in the app secret) holding the funded deployer key: PRIVATE_KEY or FUNDED_KEY.
  deployerSecretKey: PRIVATE_KEY
  # ArraySummation constructor params. Smoke test sums indexes [1,2,3], so arraySize must be >= 4.
  arraySize: 10
  maxValue: 10000
  arraySeed: 1
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "250m"

# Playground job: deploys the contracts the public documentation points readers at — a shared
# ArraySummation target for a first settlement with no Solidity written, and an
# ArraySummationFactory for a reader who wants an instance nobody else is advancing. Both addresses
# are served in the `contracts` block of GET /avs-metadata, so no document has to name them.
#
# Deliberately separate from deployTarget: that target is the deployment's own smoke test, whose
# transition counter public traffic would advance, and it is reminted on every reinstall. Opt-in
# (off by default; enable on testnet). Reuses deployTarget.image, since both run forge scripts from
# the solidity-sdk image.
playground:
  enabled: false
  # Secret key (in the app secret) holding the funded deployer key: PRIVATE_KEY or FUNDED_KEY.
  deployerSecretKey: PRIVATE_KEY
  # ArraySummation constructor params for the shared target. Larger than the smoke target's so a
  # reader has room to submit repeatedly before exhausting anything interesting.
  arraySize: 16
  maxValue: 10000
  arraySeed: 1
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "250m"

# Yield Distribution test configuration - only used in LOCAL mode with l2.enabled
# Defaults to disabled; enable explicitly via --set yieldDistribution.enabled=true (e.g. in CI)
yieldDistribution:
  enabled: false
  # YieldDistributor contract address on L2
  contractAddress: "0x37A9CC16412CDA9b4f9B1ABdedd3e10BAD8A06da"
  # Owner of the YieldDistributor on the fork (used for anvil impersonation)
  ownerAddress: "0x5DD2e7db868e33c03daB85d0C623048A7980634E"
  # BLSSigCheckOperatorStateRetriever address on the L2 fork
  # In LOCAL mode this is the address present on the forked L2 chain
  blsSigCheckAddress: "0x056A41125bB62168B464ddDECd995e8494448913"
  # Test-friendly overrides applied via contract setters
  cycleLength: 1
  # Set to a large number to disable block staleness detection
  blockStaleMeasure: "100000000"
  # Fallback block number used if eth_blockNumber RPC call fails during setup
  # "Recent" Gnosis mainnet block number, but blockstaleness detection is disabled on fallback
  fallbackBlockNumber: "44000000"
  resources:
    requests:
      memory: "2Gi"
      cpu: "500m"
    limits:
      memory: "6Gi"
      cpu: "1000m"

# Shared data volume for keys and deployment configs
sharedData:
  storageClass: ""
  size: 1Gi
  accessMode: ReadWriteOnce

# =============================================================================
# Log aggregation — Loki + Alloy
# =============================================================================
# Set loki.enabled and alloy.enabled to true to deploy a Loki instance and
# an Alloy DaemonSet that ships pod logs to it.
# Alloy is the successor to Promtail (deprecated).
#
# Usage:
#   helm dependency update ./helm/gas-killer
#   helm upgrade --install gas-killer ./helm/gas-killer \
#     --set loki.enabled=true \
#     --set alloy.enabled=true
#
# Loki will be reachable inside the cluster at:
#   http://{{ .Release.Name }}-loki:3100
#
loki:
  enabled: false
  # Loki in single-binary mode — suitable for testnet / dev deployments
  deploymentMode: SingleBinary
  loki:
    commonConfig:
      replication_factor: 1
    storage:
      type: filesystem
  singleBinary:
    replicas: 1
  # Disable components not needed in single-binary mode
  read:
    replicas: 0
  write:
    replicas: 0
  backend:
    replicas: 0

alloy:
  enabled: false
  # Alloy is deployed as a DaemonSet so every node's pod logs are collected.
  # The config (including the Loki push URL derived from .Release.Name) is generated
  # by templates/alloy-config.yaml in the parent chart, so it works for any release name.
  alloy:
    configMap:
      # Parent chart creates the ConfigMap; tell alloy not to create its own.
      create: false

# =============================================================================
# Monitoring — kube-prometheus-stack (Prometheus Operator, Grafana, AlertManager)
# =============================================================================
# Enable with: --set monitoring.enabled=true
#
# Usage:
#   helm dependency update ./helm/gas-killer
#   helm upgrade --install gas-killer ./helm/gas-killer \
#     --set monitoring.enabled=true \
#     --set kube-prometheus-stack.grafana.adminPassword=<password>
#
# Grafana will be reachable inside the cluster at:
#   http://{{ .Release.Name }}-grafana
#
# For external access, enable the Grafana ingress:
#   --set monitoring.grafana.ingress.enabled=true \
#   --set monitoring.grafana.ingress.host=grafana-testnet.gaskiller.xyz
#
monitoring:
  enabled: false

  grafana:
    ingress:
      enabled: false
      # Required when enabled — the public hostname for the Grafana UI.
      host: ""
      className: nginx
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
        nginx.ingress.kubernetes.io/ssl-redirect: "true"
      # Secret name for TLS certificate. Leave empty to disable TLS.
      tlsSecretName: grafana-tls

  # Per-component scrape toggles
  serviceMonitor:
    router:
      enabled: true
      interval: 15s
    node:
      enabled: true
      interval: 15s
    signer:
      enabled: true
      interval: 15s

kube-prometheus-stack:
  prometheus:
    prometheusSpec:
      # Match all ServiceMonitors — disable the helm-values override that would
      # silently replace {} with {matchLabels: {release: gas-killer}}
      serviceMonitorSelectorNilUsesHelmValues: false
      serviceMonitorNamespaceSelectorNilUsesHelmValues: false
      serviceMonitorSelector: {}
      serviceMonitorNamespaceSelector: {}
      retention: 7d
      resources:
        requests:
          memory: 512Mi
          cpu: 200m
        limits:
          memory: 1Gi
          cpu: 500m

  grafana:
    # nameOverride keeps the service name predictable: {release}-grafana
    nameOverride: grafana
    # REQUIRED when monitoring.enabled=true — set via:
    #   --set kube-prometheus-stack.grafana.adminPassword=<password>
    adminPassword: ""
    resources:
      requests:
        memory: 128Mi
        cpu: 100m
      limits:
        memory: 256Mi
        cpu: 200m
    sidecar:
      dashboards:
        enabled: true
        label: grafana_dashboard
        labelValue: "1"

  alertmanager:
    alertmanagerSpec:
      resources:
        requests:
          memory: 64Mi
          cpu: 10m
        limits:
          memory: 128Mi
          cpu: 50m

  # kube-state-metrics and node-exporter give us pod/node resource signals
  kubeStateMetrics:
    enabled: true
  nodeExporter:
    enabled: true

  # Kubelet exposes cAdvisor metrics (container CPU/memory) — accessible on GKE worker nodes
  kubelet:
    enabled: true

  # Disable k8s control-plane exporters — not accessible on GKE
  coreDns:
    enabled: false
  kubeApiServer:
    enabled: false
  kubeControllerManager:
    enabled: false
  kubeScheduler:
    enabled: false
  kubeProxy:
    enabled: false
  kubeEtcd:
    enabled: false

  prometheusOperator:
    admissionWebhooks:
      enabled: false
    tls:
      enabled: false

  # We define our own alerting rules
  defaultRules:
    create: false

# =============================================================================
# Kubernetes Ingress for external access (optional)
# =============================================================================
# See helm/gas-killer/README.md for TLS / cert-manager setup instructions.
#
# Usage:
#   helm upgrade --install gas-killer ./helm/gas-killer \
#     --set ingress.enabled=true \
#     --set ingress.host=testnet.gaskiller.xyz
#
ingress:
  enabled: false
  # Required when enabled — the public hostname for the router ingress.
  host: ""
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  # Secret name for TLS certificate. Leave empty to disable TLS.
  tlsSecretName: gaskiller-tls
  # Explicit allowlist of URL path prefixes exposed through the public Ingress. Anything not
  # listed — notably the /admin/* key-management endpoints — is NOT routed publicly and is
  # reachable only in-cluster (ClusterIP Service, `kubectl port-forward`, or `kubectl exec`).
  # This keeps admin behind cluster access in addition to ADMIN_KEY. Add a path here only if it
  # genuinely needs to be internet-facing.
  publicPaths:
    - /tasks
    - /avs-metadata
    - /healthz
