{{- if .Values.monitoring.enabled }}
{{- if not (index .Values "kube-prometheus-stack" "grafana" "adminPassword") }}
{{- fail "monitoring.enabled=true requires kube-prometheus-stack.grafana.adminPassword to be set. Pass --set kube-prometheus-stack.grafana.adminPassword=<password>" }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "gas-killer.fullname" . }}-dashboard
  labels:
    {{- include "gas-killer.labels" . | nindent 4 }}
    grafana_dashboard: "1"
data:
  gas-killer.json: |-
    {
      "title": "Gas Killer",
      "uid": "gas-killer",
      "schemaVersion": 38,
      "refresh": "30s",
      "time": { "from": "now-1h", "to": "now" },
      "templating": {
        "list": [
          {
            "name": "namespace",
            "type": "constant",
            "query": "{{ .Release.Namespace }}"
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "text",
          "title": "Node Health",
          "gridPos": { "x": 0, "y": 0, "w": 24, "h": 1 },
          "options": { "mode": "markdown", "content": "## Node Health" }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Router Up",
          "gridPos": { "x": 0, "y": 1, "w": 4, "h": 4 },
          "targets": [{
            "expr": "up{job=~\".*gas-killer.*router.*\"}",
            "legendFormat": "router"
          }],
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"] },
            "orientation": "auto",
            "colorMode": "background",
            "graphMode": "none"
          },
          "fieldConfig": {
            "defaults": {
              "mappings": [
                { "type": "value", "options": { "0": { "text": "DOWN", "color": "red" }, "1": { "text": "UP", "color": "green" } } }
              ]
            }
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Nodes Up",
          "gridPos": { "x": 4, "y": 1, "w": 4, "h": 4 },
          "targets": [{
            "expr": "count(up{job=~\".*gas-killer.*nodes*.*\"} == 1)",
            "legendFormat": "up"
          }],
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"] },
            "orientation": "auto",
            "colorMode": "background",
            "graphMode": "none"
          }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Pod Restarts (1h)",
          "gridPos": { "x": 8, "y": 1, "w": 4, "h": 4 },
          "targets": [{
            "expr": "sum(increase(kube_pod_container_status_restarts_total{namespace=\"{{ .Release.Namespace }}\", pod=~\"{{ include "gas-killer.fullname" . }}-.*\"}[1h]))",
            "legendFormat": "restarts"
          }],
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"] },
            "colorMode": "background",
            "graphMode": "none"
          },
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": 0 },
                  { "color": "yellow", "value": 1 },
                  { "color": "red", "value": 3 }
                ]
              }
            }
          }
        },
        {
          "id": 5,
          "type": "stat",
          "title": "Database",
          "description": "Router SQLite store liveness — gas_killer_db_up, set by the router's periodic SELECT 1 health check.",
          "gridPos": { "x": 12, "y": 1, "w": 4, "h": 4 },
          "targets": [{
            "expr": "gas_killer_db_up",
            "legendFormat": "db"
          }],
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"] },
            "orientation": "auto",
            "colorMode": "background",
            "graphMode": "none"
          },
          "fieldConfig": {
            "defaults": {
              "mappings": [
                { "type": "value", "options": { "0": { "text": "DOWN", "color": "red" }, "1": { "text": "UP", "color": "green" } } }
              ]
            }
          }
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "RPC Health",
          "description": "gas_killer_rpc_healthy per chain: 0 once consecutive RPC failures reach RPC_FAILURE_THRESHOLD, back to 1 on the next success. A background probe checks each chain every 15s, so this reflects provider reality even on an idle router. While L1 reads 0, POST /tasks is refused with 503 RPC_UNAVAILABLE — every round anchors to an L1 reference block, so an L1 outage blocks work for L2 targets too.",
          "gridPos": { "x": 16, "y": 1, "w": 8, "h": 4 },
          "targets": [{
            "expr": "gas_killer_rpc_healthy",
            "legendFormat": "{{ "{{" }} chain {{ "}}" }}"
          }],
          "fieldConfig": {
            "defaults": {
              "min": 0,
              "max": 1,
              "custom": { "lineWidth": 2, "fillOpacity": 20 },
              "mappings": [
                { "type": "value", "options": { "0": { "text": "DEGRADED", "color": "red" }, "1": { "text": "OK", "color": "green" } } }
              ]
            }
          }
        },
        {
          "id": 10,
          "type": "text",
          "title": "Resource Usage",
          "gridPos": { "x": 0, "y": 5, "w": 24, "h": 1 },
          "options": { "mode": "markdown", "content": "## Resource Usage" }
        },
        {
          "id": 11,
          "type": "timeseries",
          "title": "CPU Usage",
          "gridPos": { "x": 0, "y": 6, "w": 12, "h": 8 },
          "targets": [{
            "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"{{ .Release.Namespace }}\", pod=~\"{{ include "gas-killer.fullname" . }}-.*\", container!=\"\"}[2m]))",
            "legendFormat": "{{ "{{" }} pod {{ "}}" }}"
          }],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "custom": { "lineWidth": 1 }
            }
          }
        },
        {
          "id": 12,
          "type": "timeseries",
          "title": "Memory Usage",
          "gridPos": { "x": 12, "y": 6, "w": 12, "h": 8 },
          "targets": [{
            "expr": "sum by (pod) (container_memory_working_set_bytes{namespace=\"{{ .Release.Namespace }}\", pod=~\"{{ include "gas-killer.fullname" . }}-.*\", container!=\"\"})",
            "legendFormat": "{{ "{{" }} pod {{ "}}" }}"
          }],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "custom": { "lineWidth": 1 }
            }
          }
        },
        {
          "id": 20,
          "type": "text",
          "title": "Aggregation",
          "gridPos": { "x": 0, "y": 14, "w": 24, "h": 1 },
          "options": { "mode": "markdown", "content": "## Aggregation" }
        },
        {
          "id": 21,
          "type": "timeseries",
          "title": "Aggregation Rounds / min",
          "description": "Payload reverts are counted apart from generic failures because they almost always mean a misconfigured target (wrong AVS or signature checker) rather than a router fault.",
          "gridPos": { "x": 0, "y": 15, "w": 12, "h": 8 },
          "targets": [
            {
              "expr": "rate(gas_killer_aggregation_rounds_completed_total[2m]) * 60",
              "legendFormat": "completed"
            },
            {
              "expr": "rate(gas_killer_aggregation_rounds_failed_total[2m]) * 60",
              "legendFormat": "failed"
            },
            {
              "expr": "rate(gas_killer_payloads_rejected_reverting_total[2m]) * 60",
              "legendFormat": "payload reverts (target misconfigured)"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "short" } }
        },
        {
          "id": 23,
          "type": "timeseries",
          "title": "Storage Computation Duration (p50/p95)",
          "description": "Router-side EVM storage-update computation, before the task is dispatched to the quorum. Not part of round latency.",
          "gridPos": { "x": 12, "y": 15, "w": 12, "h": 8 },
          "targets": [
            {
              "expr": "histogram_quantile(0.50, rate(gas_killer_storage_computation_seconds_bucket[5m]))",
              "legendFormat": "Typical (p50)"
            },
            {
              "expr": "histogram_quantile(0.95, rate(gas_killer_storage_computation_seconds_bucket[5m]))",
              "legendFormat": "Slow tail (p95)"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "s" } }
        },
        {
          "id": 40,
          "type": "text",
          "title": "Latency Breakdown",
          "gridPos": { "x": 0, "y": 23, "w": 24, "h": 1 },
          "options": { "mode": "markdown", "content": "## Latency Breakdown\n\nTwo different clocks, and the difference between them matters.\n\n**End-to-end** is what a client waits: ingress acceptance until the task settles `ready` or `failed`. It includes queue wait and router-side storage computation.\n\n**Round latency** starts later — at creator dispatch — and covers only the round itself: `p2p + node compute` (P2P transit ×2, node EVMSketch, BLS signing, aggregation) plus `router execution` (contract calls and tx submission, broken out per phase alongside). Round latency is observed for successful rounds only, so receipt timeouts cannot skew its percentiles.\n\nEnd-to-end minus round latency is therefore the queue wait plus storage computation." }
        },
        {
          "id": 45,
          "type": "timeseries",
          "title": "End-to-End Latency (p50 / p95)",
          "description": "What a client actually waits: ingress acceptance to a task settling ready or failed, queue wait included. Resolution is whole seconds — both ends come from the task row's second-granularity timestamps.",
          "gridPos": { "x": 0, "y": 24, "w": 8, "h": 8 },
          "targets": [
            {
              "expr": "histogram_quantile(0.50, rate(gas_killer_task_e2e_seconds_bucket[5m]))",
              "legendFormat": "p50"
            },
            {
              "expr": "histogram_quantile(0.95, rate(gas_killer_task_e2e_seconds_bucket[5m]))",
              "legendFormat": "p95"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "s" } }
        },
        {
          "id": 44,
          "type": "timeseries",
          "title": "Round Latency Breakdown",
          "description": "The round total against its two components, so a regression can be attributed without switching panels. Total is creator dispatch to verifyAndUpdate receipt, successful rounds only.",
          "gridPos": { "x": 8, "y": 24, "w": 8, "h": 8 },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, rate(gas_killer_round_latency_seconds_bucket[5m]))",
              "legendFormat": "round total p95"
            },
            {
              "expr": "histogram_quantile(0.95, rate(gas_killer_p2p_round_trip_seconds_bucket[5m]))",
              "legendFormat": "p2p + node compute p95"
            },
            {
              "expr": "histogram_quantile(0.95, rate(gas_killer_execution_duration_seconds_bucket[5m]))",
              "legendFormat": "router execution p95"
            },
            {
              "expr": "histogram_quantile(0.50, rate(gas_killer_round_latency_seconds_bucket[5m]))",
              "legendFormat": "round total p50"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "s" } }
        },
        {
          "id": 46,
          "type": "timeseries",
          "title": "Executor Phases (p95)",
          "description": "Per-phase latency inside handle_verification, in execution order: getMessageHash preflight → supportsInterface check → tx send (includes gas estimation) → receipt confirmation (block inclusion wait). Overlaid so the dominant phase is visible at a glance; receipt confirmation is normally block-time bound and dwarfs the rest.",
          "gridPos": { "x": 16, "y": 24, "w": 8, "h": 8 },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, rate(gas_killer_executor_hash_preflight_seconds_bucket[5m]))",
              "legendFormat": "hash preflight"
            },
            {
              "expr": "histogram_quantile(0.95, rate(gas_killer_executor_supports_interface_seconds_bucket[5m]))",
              "legendFormat": "supportsInterface"
            },
            {
              "expr": "histogram_quantile(0.95, rate(gas_killer_executor_tx_send_seconds_bucket[5m]))",
              "legendFormat": "tx send"
            },
            {
              "expr": "histogram_quantile(0.95, rate(gas_killer_executor_receipt_confirmation_seconds_bucket[5m]))",
              "legendFormat": "receipt confirmation"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "s" } }
        },
        {
          "id": 42,
          "type": "timeseries",
          "title": "Node EVMSketch Duration (p50 / p99)",
          "description": "Time for call_to_encoded_state_updates_with_evmsketch on the node (cache-miss path). Scraped from the node's /metrics endpoint.",
          "gridPos": { "x": 0, "y": 32, "w": 12, "h": 8 },
          "targets": [
            {
              "expr": "histogram_quantile(0.50, rate(gas_killer_node_evmsketch_duration_seconds_bucket[5m]))",
              "legendFormat": "p50"
            },
            {
              "expr": "histogram_quantile(0.99, rate(gas_killer_node_evmsketch_duration_seconds_bucket[5m]))",
              "legendFormat": "p99"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "s" } }
        },
        {
          "id": 43,
          "type": "timeseries",
          "title": "Task Queue Depth",
          "description": "Number of tasks sitting in the ingress queue waiting to be processed. Sustained depth > 0 under burst load indicates the 1 msg/sec P2P rate limit is the bottleneck.",
          "gridPos": { "x": 12, "y": 32, "w": 12, "h": 8 },
          "targets": [
            {
              "expr": "gas_killer_queue_depth",
              "legendFormat": "queued tasks"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": 0 },
                  { "color": "yellow", "value": 1 },
                  { "color": "red", "value": 5 }
                ]
              }
            }
          }
        },
        {
          "id": 60,
          "type": "text",
          "title": "Orchestrator Internals",
          "gridPos": { "x": 0, "y": 40, "w": 24, "h": 1 },
          "options": { "mode": "markdown", "content": "## Orchestrator Internals\n\nRound-internal metrics from the commonware orchestrator and BLS executor registries, surfaced via the runtime context on the same `/metrics` endpoint.\n\nTime to quorum = round broadcast → signature threshold reached (isolates aggregation from EigenLayer reads). Round timeouts = aggregation windows that expired before the round completed — the primary signal for tuning `ROUND_TIMEOUT`. EigenLayer state retrieval = operator resolution + non-signer stakes/signature reads between quorum and `handle_verification`; subtract it and time-to-quorum from P2P round-trip to estimate pure transport+signing overhead." }
        },
        {
          "id": 61,
          "type": "timeseries",
          "title": "Time to Quorum (p50 / p95)",
          "gridPos": { "x": 0, "y": 41, "w": 6, "h": 8 },
          "targets": [
            {
              "expr": "histogram_quantile(0.50, rate(orchestrator_time_to_quorum_seconds_bucket[5m]))",
              "legendFormat": "p50"
            },
            {
              "expr": "histogram_quantile(0.95, rate(orchestrator_time_to_quorum_seconds_bucket[5m]))",
              "legendFormat": "p95"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "s" } }
        },
        {
          "id": 62,
          "type": "timeseries",
          "title": "Signature Arrival Spread (p50 / p99)",
          "description": "Round broadcast → each accepted signature. A wide p50→p99 gap means straggler operators are holding rounds open.",
          "gridPos": { "x": 6, "y": 41, "w": 6, "h": 8 },
          "targets": [
            {
              "expr": "histogram_quantile(0.50, rate(orchestrator_signature_arrival_seconds_bucket[5m]))",
              "legendFormat": "p50"
            },
            {
              "expr": "histogram_quantile(0.99, rate(orchestrator_signature_arrival_seconds_bucket[5m]))",
              "legendFormat": "p99"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "s" } }
        },
        {
          "id": 63,
          "type": "timeseries",
          "title": "Round Outcomes / min",
          "description": "A timed-out round is abandoned and the orchestrator moves to the next queued task; sustained timeouts mean ROUND_TIMEOUT is shorter than time-to-quorum.",
          "gridPos": { "x": 12, "y": 41, "w": 6, "h": 8 },
          "targets": [
            {
              "expr": "rate(orchestrator_round_executions_total{status=\"Success\"}[2m]) * 60",
              "legendFormat": "executed"
            },
            {
              "expr": "rate(orchestrator_round_executions_total{status=\"Failure\"}[2m]) * 60",
              "legendFormat": "execution failed"
            },
            {
              "expr": "rate(orchestrator_round_timeouts_total[2m]) * 60",
              "legendFormat": "window timeout"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "short" } }
        },
        {
          "id": 64,
          "type": "timeseries",
          "title": "Signatures / min by Outcome",
          "description": "Success = accepted and stored. Invalid = failed decode, validation, or BLS verification. Dropped = duplicates, unknown senders/rounds, already-executed rounds.",
          "gridPos": { "x": 18, "y": 41, "w": 6, "h": 8 },
          "targets": [
            {
              "expr": "rate(orchestrator_signatures_total{status=\"Success\"}[2m]) * 60",
              "legendFormat": "accepted"
            },
            {
              "expr": "rate(orchestrator_signatures_total{status=\"Invalid\"}[2m]) * 60",
              "legendFormat": "invalid"
            },
            {
              "expr": "rate(orchestrator_signatures_total{status=\"Dropped\"}[2m]) * 60",
              "legendFormat": "dropped"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "short" } }
        },
        {
          "id": 65,
          "type": "timeseries",
          "title": "EigenLayer State Retrieval (p50 / p95)",
          "description": "Operator-address resolution + current-block query + getNonSignerStakesAndSignature, per execution. Runs between quorum and handle_verification, so it is included in the P2P Round-Trip measurement above.",
          "gridPos": { "x": 0, "y": 49, "w": 12, "h": 8 },
          "targets": [
            {
              "expr": "histogram_quantile(0.50, rate(executor_state_retrieval_seconds_bucket[5m]))",
              "legendFormat": "p50"
            },
            {
              "expr": "histogram_quantile(0.95, rate(executor_state_retrieval_seconds_bucket[5m]))",
              "legendFormat": "p95"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "s" } }
        },
        {
          "id": 30,
          "type": "text",
          "title": "Ingress",
          "gridPos": { "x": 0, "y": 57, "w": 24, "h": 1 },
          "options": { "mode": "markdown", "content": "## Ingress\n\nIngress counters are labelled with the `key_id` of the calling API key — the key's public id, never its value, matching the `key_id` field on the audit log lines. The aggregate panel sums across keys; the per-key panels break the same counters down so load and abuse can be attributed to a client.\n\nA key keeps its series until the router restarts, so a revoked key's history stays visible for as long as the process lives." }
        },
        {
          "id": 31,
          "type": "timeseries",
          "title": "Ingress Request Rate / min",
          "description": "Summed across every API key. Rejections split by cause: validation, per-key rate limit, and load shedding when the queue is full.",
          "gridPos": { "x": 0, "y": 58, "w": 12, "h": 8 },
          "targets": [
            {
              "expr": "sum(rate(gas_killer_ingress_requests_accepted_total[2m])) * 60",
              "legendFormat": "accepted"
            },
            {
              "expr": "sum(rate(gas_killer_ingress_requests_deduplicated_total[2m])) * 60",
              "legendFormat": "deduplicated (retry)"
            },
            {
              "expr": "sum(rate(gas_killer_ingress_requests_rejected_total[2m])) * 60",
              "legendFormat": "rejected (400)"
            },
            {
              "expr": "sum(rate(gas_killer_ingress_requests_rate_limited_total[2m])) * 60",
              "legendFormat": "rate limited (429)"
            },
            {
              "expr": "sum(rate(gas_killer_ingress_requests_at_capacity_total[2m])) * 60",
              "legendFormat": "at capacity (503)"
            },
            {
              "expr": "sum(rate(gas_killer_ingress_requests_rpc_unavailable_total[2m])) * 60",
              "legendFormat": "rpc unavailable (503)"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "short" } }
        },
        {
          "id": 34,
          "type": "timeseries",
          "title": "Accepted / min by API key",
          "description": "Which clients are driving load. One line per key that has submitted since the router started.",
          "gridPos": { "x": 12, "y": 58, "w": 12, "h": 8 },
          "targets": [
            {
              "expr": "sum by (key_id) (rate(gas_killer_ingress_requests_accepted_total[2m])) * 60",
              "legendFormat": "{{ "{{" }} key_id {{ "}}" }}"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "short" } }
        },
        {
          "id": 35,
          "type": "timeseries",
          "title": "Rejections / min by API key",
          "description": "Which clients are being turned away, and why. Kept as three series rather than one sum so the cause stays visible: a key that is rate limited is behaving differently from one sending invalid requests.",
          "gridPos": { "x": 0, "y": 66, "w": 12, "h": 8 },
          "targets": [
            {
              "expr": "sum by (key_id) (rate(gas_killer_ingress_requests_rejected_total[2m])) * 60",
              "legendFormat": "{{ "{{" }} key_id {{ "}}" }} rejected"
            },
            {
              "expr": "sum by (key_id) (rate(gas_killer_ingress_requests_rate_limited_total[2m])) * 60",
              "legendFormat": "{{ "{{" }} key_id {{ "}}" }} rate limited"
            },
            {
              "expr": "sum by (key_id) (rate(gas_killer_ingress_requests_at_capacity_total[2m])) * 60",
              "legendFormat": "{{ "{{" }} key_id {{ "}}" }} at capacity"
            },
            {
              "expr": "sum by (key_id) (rate(gas_killer_ingress_requests_rpc_unavailable_total[2m])) * 60",
              "legendFormat": "{{ "{{" }} key_id {{ "}}" }} rpc unavailable"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "short" } }
        },
        {
          "id": 32,
          "type": "stat",
          "title": "Tasks Created",
          "description": "Tasks dequeued and dispatched to the quorum over the dashboard's selected time range.",
          "gridPos": { "x": 12, "y": 66, "w": 6, "h": 8 },
          "targets": [{
            "expr": "increase(gas_killer_tasks_created_total[$__range])",
            "legendFormat": "tasks"
          }],
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"] },
            "colorMode": "background",
            "graphMode": "area"
          }
        },
        {
          "id": 33,
          "type": "stat",
          "title": "Tasks Expired",
          "description": "Tasks settled expired over the selected time range. The TTL sweep series covers queued tasks the queue never reached before their block reference went stale, plus ready payloads no client collected; sustained growth there means the queue is not draining ahead of the staleness window, so raise capacity or lower submission rate rather than raising TASK_TTL_SECONDS. The restart series counts recovered tasks whose transition index the chain had already consumed, and only moves on a router restart.",
          "gridPos": { "x": 18, "y": 66, "w": 6, "h": 8 },
          "targets": [{
            "expr": "increase(gas_killer_tasks_expired_total[$__range])",
            "legendFormat": "ttl sweep"
          }, {
            "expr": "increase(gas_killer_tasks_expired_at_requeue_total[$__range])",
            "legendFormat": "spent index at restart"
          }],
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"] },
            "colorMode": "background",
            "graphMode": "area"
          }
        },
        {
          "id": 70,
          "type": "text",
          "title": "Window and Heights",
          "gridPos": { "x": 0, "y": 75, "w": 24, "h": 1 },
          "options": { "mode": "markdown", "content": "## Window and Heights\n\nThe aggregation pipeline's live shape. A wedged pipeline looks healthy everywhere else — pods up, memory flat, nothing restarting — and shows up only here, as a window whose base and highest-assigned height stop advancing together while the queue still has work.\n\nHeight outcomes are the disposition of every height the router assigned. `executed` is the healthy path. `skipped` means the quorum abandoned the height, so the task produced nothing; a sustained skip ratio above ~1% of certified heights is the signal that directives are not arriving. `foreign` is a certificate left over from a previous router life. `superseded` means the operators' reported tips moved past a height the router was still driving, which the safe-tip series explains.\n\nDirective sends are counted per recipient at the send site, because the p2p sender reports a partial drop and a full delivery identically. `rate_limited` is the operators' per-peer quota filtering our copy out before it is sent; `rejected` is our own send buffer refusing the message. Both are invisible upstream. The rate-limited messages panel is the opposite end of the same story: it counts what the *receiving* peer throttled, where the remedy is to sleep the connection rather than drop the message." }
        },
        {
          "id": 71,
          "type": "timeseries",
          "title": "Heights In Flight",
          "description": "Aggregation heights assigned and not yet resolved. One at a time is the current design; this is the series that shows the window actually opening when SEQUENCER_WINDOW is raised.",
          "gridPos": { "x": 0, "y": 76, "w": 8, "h": 8 },
          "targets": [
            {
              "expr": "gas_killer_in_flight_heights",
              "legendFormat": "in flight"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "short" } }
        },
        {
          "id": 72,
          "type": "timeseries",
          "title": "Window Base vs Highest Assigned",
          "description": "The edges of the live window against the router engine's contiguous tip. All three advancing together is healthy. Base and highest pinned while the queue is non-empty is a wedge; the engine tip falling behind the window base means heights are certifying out of order and the router can no longer observe the certificates it is waiting on.",
          "gridPos": { "x": 8, "y": 76, "w": 8, "h": 8 },
          "targets": [
            {
              "expr": "gas_killer_window_base",
              "legendFormat": "window base"
            },
            {
              "expr": "gas_killer_highest_assigned_height",
              "legendFormat": "highest assigned"
            },
            {
              "expr": "engine_tip{job=~\".*gas-killer.*router.*\"}",
              "legendFormat": "engine tip (contiguous)"
            },
            {
              "expr": "gas_killer_node_safe_tip",
              "legendFormat": "operator safe tip"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "short" } }
        },
        {
          "id": 73,
          "type": "timeseries",
          "title": "Oldest Height Age",
          "description": "How long the oldest unresolved height has been waiting. Should stay within ROUND_TIMEOUT plus settlement time; growing past a few multiples of ROUND_TIMEOUT means the height is never going to resolve on its own.",
          "gridPos": { "x": 16, "y": 76, "w": 8, "h": 8 },
          "targets": [
            {
              "expr": "gas_killer_height_age_seconds",
              "legendFormat": "oldest height"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "s" } }
        },
        {
          "id": 74,
          "type": "timeseries",
          "title": "Height Outcomes / min",
          "description": "Final disposition of every assigned height. Anything other than `executed` means a task produced no on-chain effect.",
          "gridPos": { "x": 0, "y": 84, "w": 12, "h": 8 },
          "targets": [
            {
              "expr": "sum by (outcome) (rate(gas_killer_height_outcomes_total[5m])) * 60",
              "legendFormat": "{{ "{{" }} outcome {{ "}}" }}"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "short" } }
        },
        {
          "id": 75,
          "type": "timeseries",
          "title": "Directive Sends / min by Result",
          "description": "Per-recipient outcomes of task-directive broadcasts, counted at the send site. Any sustained rate_limited is the split-digest hazard: an operator that misses an Announce and later sees a directive for a higher height votes to skip the height it missed, and that stall does not clear on its own.",
          "gridPos": { "x": 12, "y": 84, "w": 12, "h": 8 },
          "targets": [
            {
              "expr": "sum by (result) (rate(gas_killer_directive_sends_total[5m])) * 60",
              "legendFormat": "{{ "{{" }} result {{ "}}" }}"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "short" } }
        },
        {
          "id": 76,
          "type": "timeseries",
          "title": "P2P Messages Rate-Limited (10m)",
          "description": "Messages the receiving peer throttled, by channel: data_0 is the engine's ack gossip, data_1 the task directives, data_2 the interactive Schnorr rounds. The receive side does not drop a throttled message, it sleeps the whole connection — head-of-line blocking every channel on it, ping included — so any sustained value here is worse than it looks. Raise the receive side's quota before the send side's.",
          "gridPos": { "x": 0, "y": 92, "w": 12, "h": 8 },
          "targets": [
            {
              "expr": "sum by (message) (increase(network_spawner_messages_rate_limited_total[10m]))",
              "legendFormat": "{{ "{{" }} message {{ "}}" }}"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "short" } }
        },
        {
          "id": 77,
          "type": "timeseries",
          "title": "Operator Certified vs Skipped / min",
          "description": "What the operators actually signed, from their own reporters. The skip ratio against certified is the ramp gate for raising the window: hold it under 1%.",
          "gridPos": { "x": 12, "y": 92, "w": 12, "h": 8 },
          "targets": [
            {
              "expr": "sum(rate(reporter_certified_total[5m])) * 60",
              "legendFormat": "certified"
            },
            {
              "expr": "sum(rate(reporter_skipped_total[5m])) * 60",
              "legendFormat": "skipped"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "short" } }
        },
        {
          "id": 78,
          "type": "timeseries",
          "title": "Engine Acks and Digests / min by Status",
          "description": "Aggregation engine internals from the runtime registry. A rising ack failure status is the direct evidence of a digest disagreement — peers stay connected through it, so nothing else reports it.",
          "gridPos": { "x": 0, "y": 100, "w": 12, "h": 8 },
          "targets": [
            {
              "expr": "sum by (status) (rate(engine_acks_total[5m])) * 60",
              "legendFormat": "ack {{ "{{" }} status {{ "}}" }}"
            },
            {
              "expr": "sum by (status) (rate(engine_digest_total[5m])) * 60",
              "legendFormat": "digest {{ "{{" }} status {{ "}}" }}"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "short" } }
        },
        {
          "id": 79,
          "type": "stat",
          "title": "Config Fingerprints",
          "description": "Distinct consensus-critical configurations across the deployment. Must be exactly 1. More than one means the router and operators disagree on a setting that feeds the task digest or decides which heights they will sign, which does not fail loudly — quorum simply never forms while every pod reports healthy. Recovery is a coordinated whole-fleet restart, so catch it here.",
          "gridPos": { "x": 12, "y": 100, "w": 6, "h": 8 },
          "targets": [{
            "expr": "count(count by (fingerprint) (gas_killer_config_fingerprint))",
            "legendFormat": "fingerprints"
          }],
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"] },
            "colorMode": "background",
            "graphMode": "none"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": 0 },
                  { "color": "green", "value": 1 },
                  { "color": "red", "value": 2 }
                ]
              }
            }
          }
        },
        {
          "id": 80,
          "type": "stat",
          "title": "Settlement Conflicts",
          "description": "Terminal-state transitions the store refused because the task had already settled. Must be 0. A nonzero value means a task row was written twice and may carry another task's payload.",
          "gridPos": { "x": 18, "y": 100, "w": 6, "h": 8 },
          "targets": [{
            "expr": "increase(gas_killer_settlement_conflicts_total[$__range])",
            "legendFormat": "conflicts"
          }],
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"] },
            "colorMode": "background",
            "graphMode": "area"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": 0 },
                  { "color": "red", "value": 1 }
                ]
              }
            }
          }
        }
      ]
    }
{{- end }}
