{{- if and (eq .Values.global.environment "TESTNET") .Values.secretManager.enabled (or .Release.IsInstall .Values.rerun.keyExport .Values.rerun.generateRouterKey) }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "gas-killer.keyexport.fullname" . }}
  labels:
    {{- include "gas-killer.labels" . | nindent 4 }}
    app.kubernetes.io/component: key-export
  annotations:
    # Runs automatically on helm install. On helm upgrade, only fires when rerun.keyExport=true.
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "1"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        {{- include "gas-killer.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: key-export
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ default (include "gas-killer.serviceaccount.fullname" .) .Values.secretManager.serviceAccountName }}
      initContainers:
        # Wait for every job that writes to the shared volume before exporting it: the setup job
        # (operator keys), generate-router-key, and under schnorr the operator-set job.
        - name: wait-for-setup
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for setup and router key generation (timeout: {{ .Values.global.initTimeout }}s)..."
              TIMEOUT={{ .Values.global.initTimeout }}
              ELAPSED=0
              {{- if include "gas-killer.isSchnorr" . }}
              # schnorr-operators writes the registry address into avs_deploy.json after setup
              # completes. Exporting before that lands backs up a copy with no
              # addresses.schnorrStakeRegistry, and restoring it would make the job's idempotency
              # check miss the registry and deploy a fresh one, orphaning every target.
              MARKERS=".setup_complete .router_key_complete .schnorr_operators_complete"
              {{- else }}
              MARKERS=".setup_complete .router_key_complete"
              {{- end }}
              missing_markers() {
                for m in $MARKERS; do
                  [ -f "/app/.nodes/$m" ] || printf '%s ' "$m"
                done
              }
              while [ -n "$(missing_markers)" ]; do
                if [ $ELAPSED -ge $TIMEOUT ]; then
                  echo "ERROR: Timeout after ${TIMEOUT}s waiting for: $(missing_markers)"
                  exit 1
                fi
                echo "Waiting for: $(missing_markers)(${ELAPSED}s elapsed)"
                sleep 10
                ELAPSED=$((ELAPSED + 10))
              done
              echo "All volume writers complete: $MARKERS"
          volumeMounts:
            - name: shared-data
              mountPath: /app/.nodes
              readOnly: true

      containers:
        - name: export-keys
          image: {{ .Values.secretManager.cloudSdkImage | quote }}
          command:
            - bash
            - -c
            - |
              set -euo pipefail

              PROJECT="{{ required "secretManager.projectId is required when secretManager.enabled=true" .Values.secretManager.projectId }}"
              PREFIX="{{ .Values.secretManager.keyPrefix }}"

              # Rows of "<secret> <sha256> <owner>", published at the end as
              # ${PREFIX}-key-manifest, which a restore checks itself against. `owner` names the
              # job that restores the secret, because setup and generate-router-key run
              # concurrently and each verifies only its own rows.
              MANIFEST=$(mktemp)

              # Export a file, creating the secret if needed and always adding a new version, so
              # a re-run after regenerated keys overwrites with the current values. Each write is
              # read back and compared, so the manifest only ever lists a verified backup.
              export_secret() {
                local name="$1"
                local file="$2"
                local owner="${3:-setup}"

                if ! gcloud secrets describe "$name" --project="$PROJECT" &>/dev/null; then
                  echo "Creating secret $name..."
                  gcloud secrets create "$name" \
                    --project="$PROJECT" \
                    --replication-policy=automatic
                fi

                echo "Adding version to $name..."
                gcloud secrets versions add "$name" \
                  --project="$PROJECT" \
                  --data-file="$file"

                local want
                want=$(sha256sum "$file" | cut -d" " -f1)
                local readback
                readback=$(mktemp)
                if ! gcloud secrets versions access latest \
                    --secret="$name" --project="$PROJECT" > "$readback" 2>/dev/null; then
                  rm -f "$readback"
                  echo "ERROR: exported $name but could not read it back" >&2
                  exit 1
                fi
                local got
                got=$(sha256sum "$readback" | cut -d" " -f1)
                rm -f "$readback"
                if [ "$want" != "$got" ]; then
                  echo "ERROR: $name read back as $got, expected $want" >&2
                  exit 1
                fi

                printf "%s %s %s\n" "$name" "$want" "$owner" >> "$MANIFEST"
                echo "Exported $name (verified)"
              }

              # Export avs_deploy.json (contract addresses needed by all nodes and router)
              export_secret "${PREFIX}-avs-deploy" /app/.nodes/avs_deploy.json

              # Export a file only when it is on the PVC, reporting the skip rather than failing.
              export_secret_if_present() {
                local name="$1"
                local file="$2"
                local owner="${3:-setup}"

                if [ ! -f "$file" ]; then
                  echo "Skipping $name: $file is not on the shared volume"
                  return 0
                fi
                export_secret "$name" "$file" "$owner"
              }

              # Export each operator's BLS key
              {{- $nodeCount := int .Values.global.nodeCount }}
              {{- range $i := until $nodeCount }}
              {{- $nodeIndex := add $i 1 }}
              export_secret "${PREFIX}-node-{{ $nodeIndex }}-bls-key" \
                /app/.nodes/operator_keys/testacc{{ $nodeIndex }}.private.bls.key.json
              {{- end }}

              # Export each operator's secp256k1 key, the Schnorr signing key under
              # SIGNATURE_SCHEME=schnorr and unused under bls. Exported in both modes: only a
              # backup taken while they are still on the volume survives a PVC rebuild.
              {{- range $i := until $nodeCount }}
              {{- $nodeIndex := add $i 1 }}
              export_secret_if_present "${PREFIX}-node-{{ $nodeIndex }}-ecdsa-key" \
                /app/.nodes/operator_keys/testacc{{ $nodeIndex }}.private.ecdsa.key.json
              {{- end }}

              # Export router keypair, owned by generate-router-key, which restores it.
              export_secret "${PREFIX}-router-private-key" \
                /app/.nodes/router_orchestrator.json router-key
              export_secret "${PREFIX}-router-public-key" \
                /app/.nodes/public_orchestrator.json router-key

              # The exports above are hard-coded per node index, so anything else on the volume
              # has no secret behind it and a rebuild would lose it.
              UNBACKED=0
              for f in /app/.nodes/operator_keys/*.json; do
                [ -e "$f" ] || continue
                case "$(basename "$f")" in
                  *.private.bls.key.json|*.private.ecdsa.key.json) continue ;;
                esac
                echo "WARNING: $f is on the shared volume with no corresponding secret" >&2
                UNBACKED=$((UNBACKED + 1))
              done
              if [ "$UNBACKED" -gt 0 ]; then
                echo "WARNING: ${UNBACKED} unbacked file(s); a volume rebuild would lose them" >&2
              fi

              # Published last, so a manifest never lists an export that did not finish.
              gcloud secrets describe "${PREFIX}-key-manifest" --project="$PROJECT" &>/dev/null \
                || gcloud secrets create "${PREFIX}-key-manifest" \
                     --project="$PROJECT" --replication-policy=automatic
              gcloud secrets versions add "${PREFIX}-key-manifest" \
                --project="$PROJECT" --data-file="$MANIFEST"
              echo "Recorded key manifest ($(wc -l < "$MANIFEST" | tr -d " ") entries):"
              cut -d" " -f1 "$MANIFEST" | sed "s/^/  /"
              rm -f "$MANIFEST"

              echo "All secrets exported successfully"
          volumeMounts:
            - name: shared-data
              mountPath: /app/.nodes
              readOnly: true
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"

      volumes:
        - name: shared-data
          persistentVolumeClaim:
            claimName: {{ include "gas-killer.shareddata.fullname" . }}
{{- end }}
