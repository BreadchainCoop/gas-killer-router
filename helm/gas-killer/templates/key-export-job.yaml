{{- if and (eq .Values.global.environment "TESTNET") .Values.secretManager.enabled (or .Release.IsInstall .Values.rerun.keyExport .Values.rerun.generateRouterKey) }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "gas-killer.keyexport.fullname" . }}
  labels:
    {{- include "gas-killer.labels" . | nindent 4 }}
    app.kubernetes.io/component: key-export
  annotations:
    # Runs automatically on helm install. On helm upgrade, only fires when rerun.keyExport=true.
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "1"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        {{- include "gas-killer.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: key-export
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ default (include "gas-killer.serviceaccount.fullname" .) .Values.secretManager.serviceAccountName }}
      initContainers:
        # Wait for every job that writes to the shared volume before exporting it: the setup job
        # (operator keys), generate-router-key, and under schnorr the operator-set job.
        - name: wait-for-setup
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for setup and router key generation (timeout: {{ .Values.global.initTimeout }}s)..."
              TIMEOUT={{ .Values.global.initTimeout }}
              ELAPSED=0
              {{- if include "gas-killer.isSchnorr" . }}
              # schnorr-operators writes the registry address into avs_deploy.json after setup
              # completes. Exporting before that lands backs up a copy with no
              # addresses.schnorrStakeRegistry, and restoring it would make the job's idempotency
              # check miss the registry and deploy a fresh one, orphaning every target.
              MARKERS=".setup_complete .router_key_complete .schnorr_operators_complete"
              {{- else }}
              MARKERS=".setup_complete .router_key_complete"
              {{- end }}
              missing_markers() {
                for m in $MARKERS; do
                  [ -f "/app/.nodes/$m" ] || printf '%s ' "$m"
                done
              }
              while [ -n "$(missing_markers)" ]; do
                if [ $ELAPSED -ge $TIMEOUT ]; then
                  echo "ERROR: Timeout after ${TIMEOUT}s waiting for: $(missing_markers)"
                  exit 1
                fi
                echo "Waiting for: $(missing_markers)(${ELAPSED}s elapsed)"
                sleep 10
                ELAPSED=$((ELAPSED + 10))
              done
              echo "All volume writers complete: $MARKERS"
          volumeMounts:
            - name: shared-data
              mountPath: /app/.nodes
              readOnly: true

      containers:
        - name: export-keys
          image: {{ .Values.secretManager.cloudSdkImage | quote }}
          command:
            - bash
            - -c
            - |
              set -euo pipefail

              PROJECT="{{ required "secretManager.projectId is required when secretManager.enabled=true" .Values.secretManager.projectId }}"
              PREFIX="{{ .Values.secretManager.keyPrefix }}"

              # Export a file to GCP Secret Manager, creating the secret if needed and always
              # adding a new version. This means re-runs (e.g. after a fresh helm install
              # that regenerated keys) will overwrite with the latest values.
              export_secret() {
                local name="$1"
                local file="$2"

                if ! gcloud secrets describe "$name" --project="$PROJECT" &>/dev/null; then
                  echo "Creating secret $name..."
                  gcloud secrets create "$name" \
                    --project="$PROJECT" \
                    --replication-policy=automatic
                fi

                echo "Adding version to $name..."
                gcloud secrets versions add "$name" \
                  --project="$PROJECT" \
                  --data-file="$file"
                echo "Exported $name"
              }

              # Export avs_deploy.json (contract addresses needed by all nodes and router)
              export_secret "${PREFIX}-avs-deploy" /app/.nodes/avs_deploy.json

              # Export a file only when it is on the PVC, reporting the skip rather than failing.
              export_secret_if_present() {
                local name="$1"
                local file="$2"

                if [ ! -f "$file" ]; then
                  echo "Skipping $name: $file is not on the shared volume"
                  return 0
                fi
                export_secret "$name" "$file"
              }

              # Export each operator's BLS key
              {{- $nodeCount := int .Values.global.nodeCount }}
              {{- range $i := until $nodeCount }}
              {{- $nodeIndex := add $i 1 }}
              export_secret "${PREFIX}-node-{{ $nodeIndex }}-bls-key" \
                /app/.nodes/operator_keys/testacc{{ $nodeIndex }}.private.bls.key.json
              {{- end }}

              # Export each operator's secp256k1 key, the Schnorr signing key under
              # SIGNATURE_SCHEME=schnorr and unused under bls. Exported in both modes: only a
              # backup taken while they are still on the volume survives a PVC rebuild.
              {{- range $i := until $nodeCount }}
              {{- $nodeIndex := add $i 1 }}
              export_secret_if_present "${PREFIX}-node-{{ $nodeIndex }}-ecdsa-key" \
                /app/.nodes/operator_keys/testacc{{ $nodeIndex }}.private.ecdsa.key.json
              {{- end }}

              # Export router keypair (generated by the generate-router-key job)
              export_secret "${PREFIX}-router-private-key" /app/.nodes/router_orchestrator.json
              export_secret "${PREFIX}-router-public-key" /app/.nodes/public_orchestrator.json

              echo "All secrets exported successfully"
          volumeMounts:
            - name: shared-data
              mountPath: /app/.nodes
              readOnly: true
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"

      volumes:
        - name: shared-data
          persistentVolumeClaim:
            claimName: {{ include "gas-killer.shareddata.fullname" . }}
{{- end }}
