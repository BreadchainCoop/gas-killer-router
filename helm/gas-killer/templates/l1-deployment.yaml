{{- if and .Values.l1.enabled .Values.secrets.forkUrl (or (eq .Values.global.environment "LOCAL") (include "gas-killer.simFork.enabled" . | eq "true")) }}
{{- /* L1 (Anvil) deployment - the chain itself in LOCAL mode, a simulation fork when l1.simFork.enabled */ -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gas-killer.l1.fullname" . }}
  labels:
    {{- include "gas-killer.labels" . | nindent 4 }}
    app.kubernetes.io/component: l1
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "gas-killer.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: l1
  template:
    metadata:
      labels:
        {{- include "gas-killer.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: l1
    spec:
      # Prioritize keeping L1 pod running - it holds critical state
      {{- if .Values.l1.priorityClassName }}
      priorityClassName: {{ .Values.l1.priorityClassName }}
      {{- end }}
      containers:
        - name: l1
          image: "{{ .Values.l1.image.repository }}:{{ .Values.l1.image.tag }}"
          imagePullPolicy: {{ .Values.l1.image.pullPolicy }}
          # Supplied here rather than left to the image's entrypoint, which bakes its flags in and
          # would ignore ANVIL_EXTRA_ARGS — the render-time guard would pass while the fork came up
          # still capped, which is the failure this whole path exists to remove. Mirrors the
          # docker-compose command the e2e legs run against this same image.
          command: ["/bin/sh", "-c"]
          args:
            - |
              exec anvil --fork-url "$FORK_URL" --host 0.0.0.0 --port 8545 \
                --code-size-limit 65536 \
                --timeout 120000 \
                --retries 5 \
                --compute-units-per-second 300 $ANVIL_EXTRA_ARGS
          env:
            - name: FORK_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "gas-killer.secret.fullname" . }}
                  key: FORK_URL
            - name: ANVIL_EXTRA_ARGS
              value: {{ .Values.l1.extraArgs | default "" | quote }}
          ports:
            - name: rpc
              containerPort: 8545
              protocol: TCP
          # Use TCP socket probe on the RPC port - more reliable than pgrep which may not exist in container
          livenessProbe:
            tcpSocket:
              port: rpc
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 5
          readinessProbe:
            tcpSocket:
              port: rpc
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            {{- toYaml .Values.l1.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "gas-killer.l1.fullname" . }}
  labels:
    {{- include "gas-killer.labels" . | nindent 4 }}
    app.kubernetes.io/component: l1
spec:
  type: {{ .Values.l1.service.type }}
  ports:
    - port: {{ .Values.l1.service.port }}
      targetPort: rpc
      protocol: TCP
      name: rpc
  selector:
    {{- include "gas-killer.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: l1
{{- end }}
