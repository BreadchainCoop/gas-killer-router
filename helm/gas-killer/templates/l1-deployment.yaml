{{- if and .Values.l1.enabled .Values.secrets.forkUrl (or (eq .Values.global.environment "LOCAL") (include "gas-killer.simFork.enabled" . | eq "true")) }}
{{- /* L1 (Anvil) deployment - the chain itself in LOCAL mode, a simulation fork when l1.simFork.enabled */ -}}
{{- if include "gas-killer.simFork.refork" . | eq "true" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "gas-killer.l1.fullname" . }}-refork-proxy
  labels:
    {{- include "gas-killer.labels" . | nindent 4 }}
    app.kubernetes.io/component: l1
data:
  refork-proxy.py: |
{{ .Files.Get "files/refork-proxy.py" | indent 4 }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gas-killer.l1.fullname" . }}
  labels:
    {{- include "gas-killer.labels" . | nindent 4 }}
    app.kubernetes.io/component: l1
spec:
  replicas: 1
  # One replica with nothing durable in it: a rolling update would need a second 2-4 CPU pod
  # scheduled beside the first, which a small node pool cannot fit, and a second fork would not
  # share the first's state anyway. Take the short outage instead.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "gas-killer.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: l1
  template:
    metadata:
      labels:
        {{- include "gas-killer.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: l1
      {{- if include "gas-killer.simFork.refork" . | eq "true" }}
      annotations:
        # A ConfigMap edit alone does not restart the pod, and the proxy reads its script once
        # at start; hashing it here rolls the pod whenever the script changes.
        checksum/refork-proxy: {{ .Files.Get "files/refork-proxy.py" | sha256sum }}
      {{- end }}
    spec:
      # Prioritize keeping L1 pod running - it holds critical state
      {{- if .Values.l1.priorityClassName }}
      priorityClassName: {{ .Values.l1.priorityClassName }}
      {{- end }}
      containers:
        - name: l1
          image: "{{ .Values.l1.image.repository }}:{{ .Values.l1.image.tag }}"
          imagePullPolicy: {{ .Values.l1.image.pullPolicy }}
          # Supplied here rather than left to the image's entrypoint, which bakes its flags in and
          # would ignore ANVIL_EXTRA_ARGS — the render-time guard would pass while the fork came up
          # still capped, which is the failure this whole path exists to remove. Mirrors the
          # docker-compose command the e2e legs run against this same image.
          command: ["/bin/sh", "-c"]
          args:
            - |
              exec anvil --fork-url "$FORK_URL" --host 0.0.0.0 --port 8545 \
                --code-size-limit 65536 \
                --timeout 120000 \
                --retries 5 \
                --compute-units-per-second 300 $ANVIL_EXTRA_ARGS
          env:
            - name: FORK_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "gas-killer.secret.fullname" . }}
                  key: FORK_URL
            - name: ANVIL_EXTRA_ARGS
              value: {{ .Values.l1.extraArgs | default "" | quote }}
          ports:
            - name: rpc
              containerPort: 8545
              protocol: TCP
          # Use TCP socket probe on the RPC port - more reliable than pgrep which may not exist in container
          livenessProbe:
            tcpSocket:
              port: rpc
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 5
          readinessProbe:
            tcpSocket:
              port: rpc
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            {{- toYaml .Values.l1.resources | nindent 12 }}
        {{- if include "gas-killer.simFork.refork" . | eq "true" }}
        # Re-forks Anvil to the block each request asks for; see files/refork-proxy.py. Without it
        # a task anchored past the fork block cannot be simulated at all.
        - name: refork-proxy
          image: "{{ .Values.l1.simFork.refork.image.repository }}:{{ .Values.l1.simFork.refork.image.tag }}"
          imagePullPolicy: {{ .Values.l1.simFork.refork.image.pullPolicy }}
          command: ["python3", "-u", "/opt/refork/refork-proxy.py"]
          env:
            - name: ANVIL_URL
              value: "http://127.0.0.1:8545"
            - name: LISTEN_PORT
              value: {{ .Values.l1.simFork.refork.port | quote }}
            - name: FORK_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "gas-killer.secret.fullname" . }}
                  key: FORK_URL
          ports:
            - name: sim
              containerPort: {{ .Values.l1.simFork.refork.port }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: sim
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: sim
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 5
          volumeMounts:
            - name: refork-proxy
              mountPath: /opt/refork
              readOnly: true
          resources:
            {{- toYaml .Values.l1.simFork.refork.resources | nindent 12 }}
      volumes:
        - name: refork-proxy
          configMap:
            name: {{ include "gas-killer.l1.fullname" . }}-refork-proxy
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "gas-killer.l1.fullname" . }}
  labels:
    {{- include "gas-killer.labels" . | nindent 4 }}
    app.kubernetes.io/component: l1
spec:
  type: {{ .Values.l1.service.type }}
  ports:
    - port: {{ .Values.l1.service.port }}
      # Through the re-fork proxy when it runs, so SIM_HTTP_RPC gets a fork that follows the
      # task's block; straight to Anvil otherwise (LOCAL mode, where it is the chain itself).
      targetPort: {{ ternary "sim" "rpc" (include "gas-killer.simFork.refork" . | eq "true") }}
      protocol: TCP
      name: rpc
  selector:
    {{- include "gas-killer.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: l1
{{- end }}
