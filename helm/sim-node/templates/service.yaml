apiVersion: v1
kind: Service
metadata:
  name: {{ include "sim-node.name" . }}
  labels:
    {{- include "sim-node.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.httpPort }}
      targetPort: http
    - name: ws
      port: {{ .Values.service.wsPort }}
      targetPort: ws
  selector:
    {{- include "sim-node.selectorLabels" . | nindent 4 }}
---
# Headless service the StatefulSet requires.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sim-node.name" . }}-headless
  labels:
    {{- include "sim-node.labels" . | nindent 4 }}
spec:
  clusterIP: None
  ports:
    - name: http
      port: {{ .Values.service.httpPort }}
      targetPort: http
  selector:
    {{- include "sim-node.selectorLabels" . | nindent 4 }}
