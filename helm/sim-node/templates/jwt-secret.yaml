{{- /* Engine API shared secret between reth and lighthouse. Generated once and kept across
       upgrades: lookup first, otherwise a fresh 32-byte hex string. */ -}}
{{- $name := printf "%s-jwt" (include "sim-node.name" .) -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "sim-node.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  jwt.hex: {{ if $existing }}{{ index $existing.data "jwt.hex" }}{{ else }}{{ randAlphaNum 64 | sha256sum | b64enc }}{{ end }}
