name: E2E Test

on:
  push:
    branches:
      - main
      - dev
      - staging
  pull_request:
    branches:
      - main
      - dev
      - staging
  workflow_dispatch:

jobs:
  e2e-test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      # Run every leg to completion even if one fails, so a leg-specific regression
      # is always visible.
      fail-fast: false
      matrix:
        # Explicit combinations (include-only, so each entry is its own job — a bare
        # `include` added to a base axis would MERGE into the matching base combination
        # instead of creating a separate leg):
        #   - the engine-driven BLS path (legacy encoding, array-summation example)
        #   - the interactive aggregate-Schnorr path (legacy encoding, array-summation)
        #   - the aggregate-Schnorr path under the CANONICAL encoding settling a task that
        #     makes a re-entrant external call mid-transition — a green run proves
        #     re-entrancy settles safely end-to-end.
        #   - both paths against the migration-period dual-scheme base, which is the one target
        #     that has to settle under either fleet: the bls leg is what an integrator deploys
        #     against today, and the schnorr leg is the cutover, exercising a different router
        #     path and a different ERC-165 ID against the same contract
        #   - the BLS path under the PRESTATE-NET encoding, which signs the target's net
        #     storage diff read from prestateTracer/callTracer rather than a struct-log
        #     trace. `ArraySummation.sum` makes no external call at target depth, so this
        #     leg exercises the net form itself rather than its canonical fallback.
        #   - the UNBOUNDED simulation profile settling an OnchainLife 3-generation step,
        #     whose direct execution costs ~49.7M gas and therefore cannot be mined in a 30M
        #     block at all. run_e2e_test.sh asserts both halves: step 7a that a direct call
        #     exceeds the block limit, step 10b that the same transition's verifyAndUpdate
        #     receipt used a small fraction of one. Needs prestate-net (a struct-log trace of
        #     that call exhausts the container) and an anvil whose execution cap is lifted.
        include:
          - signature_scheme: bls
            state_encoding: legacy
            e2e_example: array-summation
          - signature_scheme: schnorr
            state_encoding: legacy
            e2e_example: array-summation
          - signature_scheme: schnorr
            state_encoding: canonical
            e2e_example: reentrant
          - signature_scheme: bls
            state_encoding: prestate-net
            e2e_example: array-summation
          - signature_scheme: bls
            state_encoding: prestate-net
            e2e_example: dual-scheme
          - signature_scheme: schnorr
            state_encoding: prestate-net
            e2e_example: dual-scheme
          - signature_scheme: bls
            state_encoding: prestate-net
            e2e_example: onchain-life
            sim_profile: unbounded
            anvil_extra_args: --disable-block-gas-limit

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          submodules: recursive

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create .env file
        run: |
          cp example.env .env
          if grep -q '^FORK_URL=' .env; then
            sed -i "s|^FORK_URL=.*|FORK_URL=${{ secrets.HTTP_RPC }}|" .env
          else
            echo "FORK_URL=${{ secrets.HTTP_RPC }}" >> .env
          fi

      - name: Run test
        env:
          SIGNATURE_SCHEME: ${{ matrix.signature_scheme }}
          STATE_ENCODING: ${{ matrix.state_encoding }}
          E2E_EXAMPLE: ${{ matrix.e2e_example }}
          # Unset on every leg but the unbounded one, where an empty value means the default.
          GK_SIM_PROFILE: ${{ matrix.sim_profile || 'chain' }}
          ANVIL_EXTRA_ARGS: ${{ matrix.anvil_extra_args }}
        run: bash ./scripts/run_e2e_test.sh 2>&1 | tee e2e-test-output.log; exit ${PIPESTATUS[0]}

      - name: Show router logs
        if: always()
        run: |
          echo "=== Router Logs ==="
          docker compose logs router || true

      - name: Upload test output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-output-${{ matrix.signature_scheme }}-${{ matrix.e2e_example }}
          path: e2e-test-output.log
          retention-days: 1
